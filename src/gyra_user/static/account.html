<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>个人中心 · Gyra 用户中心</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #fff;
    --border: #e5e8ef;
    --text: #1f2329;
    --muted: #8a92a6;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --danger: #d4380d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    background: #fff; border-bottom: 1px solid var(--border); padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .brand { font-size: 15px; font-weight: 600; }
  header nav { display: flex; gap: 18px; font-size: 13px; }
  header nav a { color: var(--muted); text-decoration: none; }
  header nav a:hover { color: var(--primary); }
  main { max-width: 780px; margin: 28px auto; padding: 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px 26px; margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .card .hint { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .head img { width: 52px; height: 52px; border-radius: 50%; }
  .head h1 { font-size: 18px; margin: 0 0 2px; font-weight: 600; }
  .head .meta { color: var(--muted); font-size: 12px; }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: #4e5969; }
  input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; margin-bottom: 14px; outline: none; font-family: inherit; color: var(--text);
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  button {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; font-size: 13px; font-family: inherit; color: var(--text);
  }
  button:hover { background: #fafafa; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover { background: var(--primary-hover); }
  button.danger { color: var(--danger); border-color: #ffccc7; }
  button.danger:hover { background: #fff2f0; }
  button.sm { padding: 4px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px;
       padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 8px; border-bottom: 1px solid #f2f3f6; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .muted { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .alert { padding: 9px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .alert.error { background: #fff2f0; color: var(--danger); border: 1px solid #ffccc7; }
  .alert.ok { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: #f1f2f5;
         color: #5f6675; font-size: 11px; margin-right: 4px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand">Gyra 用户中心</div>
  <nav>
    <a href="/login">登录页</a>
    <a href="/admin">管理后台</a>
    <a href="/docs">API 文档</a>
    <a href="#" id="link-logout">退出</a>
  </nav>
</header>

<main>
  <div class="card">
    <div class="head">
      <img id="avatar" alt="" />
      <div>
        <h1 id="name">—</h1>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <div id="alert" class="alert"></div>

    <h2>基本资料</h2>
    <div class="hint">用户名与角色由管理员控制，不可自行修改。</div>
    <div class="grid2">
      <div>
        <label for="fullname">昵称</label>
        <input id="fullname" placeholder="显示名称" />
      </div>
      <div>
        <label for="email">邮箱</label>
        <input id="email" type="email" placeholder="you@example.com" />
      </div>
    </div>
    <label for="avatar-url">头像地址</label>
    <input id="avatar-url" placeholder="https://..." />
    <button class="primary" id="btn-save">保存资料</button>
  </div>

  <div class="card">
    <h2>修改密码</h2>
    <div class="hint">修改后其他设备的登录状态会保留，建议同时在下方踢掉陌生设备。</div>
    <div class="grid2">
      <div>
        <label for="old-password">当前密码</label>
        <input id="old-password" type="password" autocomplete="current-password" />
      </div>
      <div>
        <label for="new-password">新密码（至少 6 位）</label>
        <input id="new-password" type="password" autocomplete="new-password" />
      </div>
    </div>
    <button class="primary" id="btn-password">修改密码</button>
  </div>

  <div class="card">
    <h2>第三方账号</h2>
    <div class="hint">绑定后可用对应平台直接登录；至少保留一种登录方式。</div>
    <table><tbody id="bindings"></tbody></table>
  </div>

  <div class="card">
    <h2>已授权的应用</h2>
    <div class="hint">这些应用可以使用你的账号单点登录；撤销后它们需要重新授权。</div>
    <table><tbody id="apps"></tbody></table>
  </div>

  <div class="card">
    <h2>登录会话</h2>
    <div class="hint">每一条对应一个已登录的设备或应用。</div>
    <table><tbody id="sessions"></tbody></table>
  </div>

  <div class="card">
    <h2>最近登录记录</h2>
    <table><tbody id="events"></tbody></table>
  </div>
</main>

<script>
const API = "/api/v1";
const $ = (id) => document.getElementById(id);
const b64 = (s) => btoa(unescape(encodeURIComponent(s)));

function showAlert(msg, kind = "ok") {
  const el = $("alert");
  el.textContent = msg;
  el.className = "alert " + kind;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (res.status === 401) { location.href = "/login"; throw new Error("unauthorized"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function row(cells) {
  const tr = document.createElement("tr");
  cells.forEach((c) => {
    const td = document.createElement("td");
    if (typeof c === "string") td.textContent = c; else td.appendChild(c);
    tr.appendChild(td);
  });
  return tr;
}

function actionBtn(text, cls, handler) {
  const b = document.createElement("button");
  b.className = "sm " + cls;
  b.textContent = text;
  b.onclick = handler;
  return b;
}

function emptyRow(tbody, text) {
  tbody.innerHTML = "";
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.className = "empty";
  td.textContent = text;
  tr.appendChild(td);
  tbody.appendChild(tr);
}

async function loadProfile() {
  const me = await api("/auth/me");
  const user = me.user || {};
  const detail = await api("/account/profile");
  $("name").textContent = detail.fullname || user.name || "—";
  $("meta").textContent = `${user.name || ""} · ${detail.role || "normal"} · id=${user.id}`;
  $("avatar").src = detail.avatar || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(user.name || "G")}`;
  $("fullname").value = detail.fullname || "";
  $("email").value = detail.email || "";
  $("avatar-url").value = detail.avatar || "";
}

async function loadBindings() {
  const items = await api("/auth/bindings");
  const tbody = $("bindings");
  tbody.innerHTML = "";
  if (!items.length) return emptyRow(tbody, "还没有绑定第三方账号");
  items.forEach((b) => {
    tbody.appendChild(row([
      b.provider,
      b.display_name || b.username || b.provider_uid,
      b.email || "",
      actionBtn("解绑", "danger", async () => {
        await api(`/auth/bindings/${encodeURIComponent(b.provider)}`, { method: "DELETE" });
        showAlert("已解绑 " + b.provider);
        loadBindings();
      }),
    ]));
  });
}

async function loadApps() {
  const data = await api("/account/apps");
  const tbody = $("apps");
  tbody.innerHTML = "";
  if (!data.items.length) return emptyRow(tbody, "还没有授权任何应用");
  data.items.forEach((app) => {
    const scopes = document.createElement("span");
    (app.scope || "").split(" ").filter(Boolean).forEach((s) => {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = s;
      scopes.appendChild(tag);
    });
    tbody.appendChild(row([
      app.name,
      scopes,
      app.granted_at ? app.granted_at.slice(0, 10) : "",
      actionBtn("撤销", "danger", async () => {
        await api(`/account/apps/${encodeURIComponent(app.client_id)}`, { method: "DELETE" });
        showAlert("已撤销 " + app.name);
        loadApps();
        loadSessions();
      }),
    ]));
  });
}

async function loadSessions() {
  const data = await api("/account/sessions");
  const tbody = $("sessions");
  tbody.innerHTML = "";
  if (!data.items.length) return emptyRow(tbody, "没有活跃会话");
  data.items.forEach((s) => {
    const ua = (s.user_agent || "").slice(0, 40);
    tbody.appendChild(row([
      s.client_name,
      `${s.ip || "-"}<div class="muted">${ua}</div>`,
      (s.created_at || "").slice(0, 16).replace("T", " "),
      actionBtn("踢下线", "danger", async () => {
        await api(`/account/sessions/${encodeURIComponent(s.jti)}`, { method: "DELETE" });
        showAlert("已踢下线");
        loadSessions();
      }),
    ]));
  });
}

async function loadEvents() {
  const items = await api("/account/login-events?limit=15");
  const tbody = $("events");
  tbody.innerHTML = "";
  if (!items.length) return emptyRow(tbody, "暂无记录");
  items.forEach((e) => {
    tbody.appendChild(row([
      e.action,
      e.provider || "-",
      e.ip || "-",
      (e.gmt_create || "").slice(0, 16).replace("T", " "),
    ]));
  });
}

$("btn-save").onclick = async () => {
  try {
    await api("/account/profile", {
      method: "PATCH",
      body: JSON.stringify({
        fullname: $("fullname").value.trim(),
        email: $("email").value.trim(),
        avatar: $("avatar-url").value.trim(),
      }),
    });
    showAlert("资料已保存");
    loadProfile();
  } catch (err) { showAlert(err.message, "error"); }
};

$("btn-password").onclick = async () => {
  const oldPassword = $("old-password").value;
  const newPassword = $("new-password").value;
  if (!oldPassword || !newPassword) return showAlert("请填写完整", "error");
  if (newPassword.length < 6) return showAlert("新密码至少 6 位", "error");
  try {
    await api("/account/password", {
      method: "POST",
      body: JSON.stringify({ old_password: b64(oldPassword), new_password: b64(newPassword) }),
    });
    $("old-password").value = "";
    $("new-password").value = "";
    showAlert("密码已修改");
  } catch (err) { showAlert(err.message, "error"); }
};

$("link-logout").onclick = async (e) => {
  e.preventDefault();
  await fetch("/api/v1/auth/logout", { method: "POST", credentials: "include" }).catch(() => {});
  location.href = "/login";
};

loadProfile().then(() => {
  loadBindings();
  loadApps();
  loadSessions();
  loadEvents();
}).catch(() => {});
</script>
</body>
</html>
