# ── 登录页品牌文案 ────────────────────────────────────────────────────
# 左侧面板的内容按 (app_id, locale) 解析，缺省时逐级回退：
#   app+locale → app+默认语言 → default+locale → default+默认语言 → 内置文案
# 不改配置也能改文案：在 /admin 的「品牌文案」里保存，下一次刷新即生效。
[branding]
default_locale = "zh"
locales = ["zh", "en"]         # 开放给访客切换的语言
rotate_interval = 6            # 左侧多屏轮播间隔（秒），0 = 不轮播

[branding.theme]
primary = "#4f46e5"            # 接入应用可以各用各的品牌色
primary_hover = "#4338ca"

