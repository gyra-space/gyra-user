# gyra-user 反代片段
#
# 两个必须做对的点：
#   1. GYRA_USER_PUBLIC_BASE_URL 要设成这里的对外地址，
#      否则 discovery 里的 issuer / redirect_uri 会写错。
#   2. X-Forwarded-Proto 必须传，否则回调地址会被拼成 http。

upstream gyra_user {
    server 127.0.0.1:8100;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name auth.example.com;

    ssl_certificate     /etc/nginx/certs/auth.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/auth.example.com.key;

    # 登录页 / 授权确认页里没有外部资源，CSP 可以收得很紧
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://gyra_user;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # 健康检查不记日志，免得刷屏
    location = /healthz {
        proxy_pass http://gyra_user;
        access_log off;
    }
}
