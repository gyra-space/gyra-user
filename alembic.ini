# Alembic configuration for gyra-user.
#
# The database URL is NOT stored here — it is resolved at runtime from
# gyra-user's own settings (configs/auth.toml + GYRA_USER_* env vars) so that
# there is exactly one source of truth. See migrations/env.py.

[alembic]
script_location = migrations
prepend_sys_path = src

# Migration filenames sort chronologically and stay readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally empty; env.py injects it.
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
