[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gyra-user"
version = "0.2.0"
description = "Standalone OAuth2 / OIDC user & auth center (SQLite + GitHub + WeChat + local login + SSO)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "cryptography>=42",  # RS256 keys + JWKS
    "httpx>=0.27",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",  # form-encoded /oauth2/token requests
    "tomli>=2.0.2; python_version < '3.11'",
]

[project.optional-dependencies]
# Production ASGI server. Uvicorn alone is fine for dev and single-process.
prod = ["gunicorn>=22.0"]

[project.scripts]
gyra-user = "gyra_user.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.uv]
# Let uv own .venv / uv.lock (this is a uv project, not a pip project).
required-version = ">=0.5"

[tool.hatch.build.targets.wheel]
packages = ["src/gyra_user"]

[tool.hatch.build.targets.sdist]
include = ["src/gyra_user", "README.md", "migrations", "alembic.ini"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    "migrations/versions",  # generated by alembic
]

[tool.ruff.lint]
# Same rule set as the Gyra monorepo so both codebases read alike.
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["gyra_user"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
]
